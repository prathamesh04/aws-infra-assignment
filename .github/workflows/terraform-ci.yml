name: Terraform CI

on:
  pull_request:
    paths:
      - 'infra/**'
  push:
    branches: [main]
    paths:
      - 'infra/**'

jobs:
  validate:
    name: Validate & Plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [staging, production]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: fmt check
        working-directory: infra/environments/${{ matrix.env }}
        run: terraform fmt -check -recursive ../../ || true

      - name: init
        working-directory: infra/environments/${{ matrix.env }}
        run: |
          cp terraform.tfvars.example /tmp/tfvars
          sed -i 's/CHANGE_ME_STRONG_PASSWORD/TestPass123!/; s/CHANGE_ME_STRONG_PRODUCTION_PASSWORD/TestPass123!/' /tmp/tfvars
          cp /tmp/tfvars terraform.tfvars
          terraform init -backend=false -input=false

      - name: validate
        working-directory: infra/environments/${{ matrix.env }}
        run: terraform validate -input=false -no-color

      - name: plan
        working-directory: infra/environments/${{ matrix.env }}
        run: terraform plan -input=false -no-color -var-file=terraform.tfvars
