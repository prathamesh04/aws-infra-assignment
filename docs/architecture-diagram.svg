<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560">
  <defs>
    <style>
      .label { font-family: Arial, sans-serif; font-size: 13px; fill: #17202a; }
      .title { font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #ffffff; }
      .sub  { font-family: Arial, sans-serif; font-size: 11px; fill: #ffffff; opacity:.9; }
      .dim  { font-family: Arial, sans-serif; font-size: 11px; fill: #5d6d7e; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#808b96"/>
    </marker>
  </defs>

  <!-- Internet -->
  <rect x="300" y="15" width="160" height="46" rx="8" fill="#f39c12"/>
  <text x="380" y="38" text-anchor="middle" class="title">Internet</text>
  <text x="380" y="53" text-anchor="middle" class="sub">Users</text>

  <!-- ALB -->
  <rect x="280" y="95" width="200" height="52" rx="8" fill="#2e86de"/>
  <text x="380" y="120" text-anchor="middle" class="title">ALB (Public)</text>
  <text x="380" y="137" text-anchor="middle" class="sub">HTTP/HTTPS</text>

  <!-- arrow down -->
  <line x1="380" y1="61" x2="380" y2="93" stroke="#808b96" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="392" y="80" class="dim">80 / 443</text>

  <!-- App box (ASG) -->
  <rect x="70" y="200" width="620" height="130" rx="10" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="380" y="222" text-anchor="middle" class="label" font-weight="bold">Auto Scaling Group — EC2 (private, t3.micro)</text>
  <rect x="120" y="235" width="250" height="78" rx="6" fill="#27ae60" opacity="0.85"/>
  <text x="245" y="260" text-anchor="middle" class="title">Docker: app (ECR)</text>
  <text x="245" y="278" text-anchor="middle" class="sub">/health, /metrics, logs</text>
  <text x="245" y="298" text-anchor="middle" class="sub">CloudWatch Agent (metrics+syslog)</text>
  <rect x="420" y="235" width="240" height="78" rx="6" fill="#27ae60" opacity="0.85"/>
  <text x="540" y="260" text-anchor="middle" class="title">Docker: app (ECR)</text>
  <text x="540" y="278" text-anchor="middle" class="sub">2 AZs, autoscaling</text>
  <text x="540" y="298" text-anchor="middle" class="sub">health-check gated by ALB</text>

  <!-- arrow ALB -> app -->
  <line x1="380" y1="147" x2="380" y2="198" stroke="#808b96" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="392" y="177" class="dim">80 (SG: ALB only)</text>

  <!-- Database -->
  <rect x="240" y="420" width="280" height="60" rx="8" fill="#8e44ad"/>
  <text x="380" y="447" text-anchor="middle" class="title">RDS PostgreSQL (private)</text>
  <text x="380" y="466" text-anchor="middle" class="sub">db.t3.micro · backups · PITR</text>

  <!-- arrow app -> db -->
  <line x1="380" y1="330" x2="380" y2="418" stroke="#808b96" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="392" y="378" class="dim">5432 (SG: App only)</text>

  <!-- Observability -->
  <rect x="30" y="500" width="700" height="46" rx="8" fill="#34495e"/>
  <text x="380" y="521" text-anchor="middle" class="title">Observability: CloudWatch Logs · Metrics · Alarms · SNS</text>
  <text x="380" y="538" text-anchor="middle" class="sub">Dashboards: Infrastructure + Application · ALB access logs → S3</text>

  <line x1="60" y1="330" x2="60" y2="498" stroke="#5d6d7e" stroke-width="2"/>
  <line x1="700" y1="330" x2="700" y2="498" stroke="#5d6d7e" stroke-width="2"/>

</svg>
